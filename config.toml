[workflow]
active_mlp = "sevennet"           # mattersim, mace_mp, or sevennet
run_dir = "runs/sevennet/orthohrombic"
input_poscar = "runs/sevennet/orthohrombic/01_relax/INPUT/POSCAR"
overwrite_next_inputs = true     # refresh downstream INPUT files from prior outputs

[execution]
auto_relaunch = true              # relaunch each stage into the configured conda env
phonopy_conda_env = ""            # empty means use the selected MLP env

[execution.extra_env]
MPLCONFIGDIR = "/tmp/mlp_phonon_matplotlib"
TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD = "1"

[plot_archive]
enabled = true                    # copy plot inputs out of runs/{mlp}/ automatically
root = "plot_archive"             # creates plot_archive/{mlp}/...
overwrite = true                  # keep the archive synchronized with stage OUTPUT

[dos]
enabled = true                    # generate DOS automatically after ph3-fc
mesh = [40, 40, 40]               # independent reciprocal-space q-point mesh
method = "tetrahedron"            # tetrahedron or gaussian
# sigma = 0.1                     # THz; required only for gaussian
# frequency_min = -1.0            # THz; optional
# frequency_max = 20.0            # THz; optional
# frequency_pitch = 0.02          # THz; optional
is_gamma_center = true
is_mesh_symmetry = true
projected = true                  # element-projected DOS; requires the full q mesh
dpi = 200

[mlp.mattersim]
calculator = "mattersim"
conda_env = "mattersim_env"

[mlp.mattersim.kwargs]
device = "cpu"
compute_stress = true
load_path = "MatterSim-v1.0.0-5M"
model_name = "m3gnet"

[mlp.mace_mp]
calculator = "mace_mp"
conda_env = "mace_env"

[mlp.mace_mp.kwargs]
model = "medium-omat-0"                # or a local checkpoint path
device = "cpu"
default_dtype = "float64"
dispersion = false

[mlp.sevennet]
calculator = "sevennet"
conda_env = "sevenn_env"

[mlp.sevennet.kwargs]
model = "/home/eoung/mlp_calc/checkpoint_fine_tuned.pth"
device = "auto"

[relax]
optimizer = "BFGS"               # LBFGS, BFGS, or FIRE
fmax = 0.001
max_steps = 20000
maxstep = 0.02                   # maximum optimizer displacement per iteration (angstrom)
write_extxyz = true

[relax.cell]
enabled = true
filter = "frechet"                # frechet (recommended) or unit
mask = [true, true, true, false, false, false]  # xx, yy, zz, yz, xz, xy
hydrostatic_strain = false      # true: allow only isotropic volume changes
constant_volume = false
scalar_pressure_gpa = 0.0         # positive values apply compressive pressure

[relax.symmetry]
enabled = false                    # preserve the input space-group symmetry
symprec = 1.0e-3                  # symmetry detection tolerance (angstrom)
adjust_positions = true
adjust_cell = true
verbose = false

[relax.n_h_bond_restraint]
enabled = false                   # true: apply harmonic N-H bond restraints
cutoff = 1.25                    # N-H bond detection cutoff (angstrom)
spring_constant = 50.0           # eV/angstrom^2

[phonopy]
calculator = "vasp"
supercell_matrix = [3, 3, 3]
primitive_matrix = "auto"
symprec = 1.0e-5
is_symmetry = true
use_SNF_supercell = false

[displacements]
distance = 0.03
is_plusminus = "auto"
is_diagonal = true
is_trigonal = false
zfill_width = 3
supercell_filename_prefix = "POSCAR"

[forces]
subtract_drift = true
write_npz = true

[band]
auto = true
nqpoints = 101
with_eigenvectors = false
with_group_velocities = false
is_band_connection = false
fc_calculator = "traditional"
fc_calculator_options = ""
write_force_constants = false
force_constants_format = "hdf5"

paths = []
labels = []

# Third-order workflow. This is independent of the phonopy sections above.
[phono3py]
calculator = "vasp"
supercell_matrix = [3, 3, 3]         # fc3 supercell
phonon_supercell_matrix = [4, 4, 4]  # fc2 supercell; may differ from fc3
primitive_matrix = "auto"
symprec = 1.0e-5
is_symmetry = true
is_mesh_symmetry = true
use_grg = false
make_r0_average = true
cutoff_frequency = 1.0e-4
log_level = 1
lang = "Rust"

[phono3py.displacements]
zfill_width = 5

[phono3py.displacements.fc3]
distance = 0.03
is_plusminus = "auto"
is_diagonal = true
# cutoff_pair_distance = 5.0       # optional pair-displacement cutoff (angstrom)
# number_of_snapshots = 100        # optional random-displacement mode
# random_seed = 12345

[phono3py.displacements.fc2]
distance = 0.03
is_plusminus = "auto"
is_diagonal = false
# number_of_snapshots = 50         # optional random-displacement mode
# random_seed = 12345

[phono3py.forces]
subtract_drift = true
write_energies = true

[phono3py.force_constants]
fc_calculator = "traditional"      # traditional, symfc, or alm if installed
fc_calculator_options = ""
symmetrize_fc2 = true
symmetrize_fc3 = true
is_compact_fc = true
use_symfc_projector = false
compression = "gzip"               # gzip, lzf, or an integer compression level

[thermal_conductivity]
methods = ["rta"]     # used by the phono3py-all command
mesh = [20, 20, 20]                    # convergence testing is required
temperatures = [300.0]
sigmas = []                         # []: tetrahedron; e.g. [0.1] for smearing
# sigma_cutoff = 3.0
is_isotope = false
mass_variances = []                 # []: phono3py defaults when isotope=true
# boundary_mfp = 1.0                # micrometers
is_kappa_star = true
# gv_delta_q = 1.0e-5
is_full_pp = false
# transport_type = "SMM19"
compression = "gzip"
# frequency_scale_factor = 1.0
# constant_averaged_interaction = 1.0e-4
# nac_q_direction = [1.0, 0.0, 0.0]
symmetrize_fc3q = false
# lapack_zheev_uplo = "L"
# openmp_per_triplets = true
# grid_points = [0, 1, 2]          # [] or omitted means all required points
solve_collective_phonon = false

[thermal_conductivity.rta]
use_ave_pp = false
write_gamma = false
read_gamma = false
is_N_U = false
write_gamma_detail = false
write_pp = false
read_pp = false

[thermal_conductivity.iterative]
is_reducible_collision_matrix = false
pinv_cutoff = 1.0e-8
pinv_method = 0
pinv_solver = 0
write_collision = false             # can create very large files
read_collision = false
write_pp = false
read_pp = false
write_LBTE_solution = false          # can create very large files

[thermal_conductivity.plots]
enabled = true                       # plot DOS from RTA fc2 and kappa from generated HDF5 files
bins = 100
mfp_unit = "nm"                      # angstrom, nm, or um
dpi = 200
temperatures = []                    # [] plots every temperature in the HDF5 file
